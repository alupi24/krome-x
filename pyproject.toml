[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kromex"
dynamic = ["version"]
description = "KROME-X: chemistry and microphysics for astrophysical simulations (code generator and runtime library, CPU and GPU)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.scripts]
kromex = "kromex.__main__:main"

[tool.setuptools]
packages = ["kromex", "kromex._vendor", "kromex._vendor.tomli"]

[tool.setuptools.package-data]
"kromex._vendor" = ["README.md"]
"kromex._vendor.tomli" = ["LICENSE"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
